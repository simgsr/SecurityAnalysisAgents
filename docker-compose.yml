services:
  securityanalysisagents:
    build: .
    env_file:
      - .env
    volumes:
      - securityanalysisagents_data:/home/appuser/.securityanalysisagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  securityanalysisagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - SECURITYANALYSISAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - securityanalysisagents_data:/home/appuser/.securityanalysisagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  securityanalysisagents_data:
  ollama_data:
