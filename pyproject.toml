[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securityanalysisagents"
version = "0.3.1"
description = "SecurityAnalysisAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.5.3",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=1.5.3",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas>=3.0.5",
    "parsel>=1.11.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3",
    "questionary>=2.1.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "setuptools>=83.0.0",
    "stockstats>=0.6.8",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=9.0",
    "pytest-subtests>=0.15",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "securityanalysisagents[bedrock]".
bedrock = [
    "langchain-aws>=1.5.0",
]

[project.scripts]
securityanalysisagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["securityanalysisagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "worklog"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor re-exports in interface.py) instead of one statement per name.
combine-as-imports = true
